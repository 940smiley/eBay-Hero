name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      EA_BUILD_ROOT: ${{ runner.temp }}\ebay-assistance-build
      EA_RELEASE_ROOT: ${{ runner.temp }}\ebay-assistance-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore InventoryPhotoOps.sln
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errorsFound = $false
          Get-ChildItem -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errorsFound = $true
              Write-Error "$($_.FullName): $($errors[0].Message)"
            }
          }
          if ($errorsFound) { exit 1 }
      - name: Build
        run: dotnet build InventoryPhotoOps.sln -c Release --no-restore
      - name: Test
        run: dotnet test InventoryPhotoOps.sln -c Release --no-build --logger trx --results-directory "${{ runner.temp }}\test-results"
      - name: Diagnostic bundle
        shell: pwsh
        run: ./scripts/Collect-Diagnostics.ps1 -OutputRoot "${{ runner.temp }}\diagnostics"
      - name: Publish portable
        shell: pwsh
        run: ./scripts/publish-portable.ps1
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}\test-results
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: ${{ runner.temp }}\diagnostics
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: eBay-Assistance-win-x64-portable
          path: |
            ${{ runner.temp }}\ebay-assistance-release\eBay-Assistance-win-x64-portable.zip
            ${{ runner.temp }}\ebay-assistance-release\eBay-Assistance-win-x64-portable.zip.sha256

